name: Python checks

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASS: ci-placeholder-not-a-secret
      DB_NAME: sqlalchemy_practice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src
      - name: Verify modules import without connecting to PostgreSQL
        run: |
          python -c "from src.config import settings; from src.orm import SyncORM, AsyncORM; from src.core import SyncCore, AsyncCore; from src.main import main; print('Imports OK')"
